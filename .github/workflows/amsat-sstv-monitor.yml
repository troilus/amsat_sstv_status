name: AMSAT SSTV Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore seen state
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: amsat-sstv-seen-${{ github.run_id }}
          restore-keys: amsat-sstv-seen-

      - name: Check SSTV reports and notify
        env:
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python amsat_sstv_monitor_action.py

      - name: Save seen state
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: amsat-sstv-seen-${{ github.run_id }}
