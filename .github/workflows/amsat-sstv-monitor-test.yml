name: AMSAT SSTV Monitor Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 首次运行测试（发送启动测试通知）
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python amsat_sstv_monitor_action.py --state seen-test.json
